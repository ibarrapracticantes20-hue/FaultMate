{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FaultMate</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="{% static 'css/estilos.css' %}">
</head>
<body class="pagina-login">
<div class="login-caja">
    <p style="text-align:left; margin-bottom:12px;">
        <a href="/" class="login-back-link">&larr; Volver al inicio</a>
    </p>
    <div class="brand-logo-login-wrap">
        <img src="{% static 'img/faultmate_logo.png' %}" alt="FaultMate" class="brand-logo brand-logo--login">
    </div>
    <p class="faultmate-subtitle">
        Sistema Inteligente de Diagnóstico Industrial
    </p>
    {% if error %}
    <p class="mensaje-error">{{ error }}</p>
    {% endif %}
    <!--
        Usuario de prueba (se crea solo al correr "migrate"):
        usuario: test
        contraseña: test123
    -->
    <form class="formulario" action="{% url 'login' %}" method="post">
        {% csrf_token %}
        <label for="usuario">Usuario</label>
        <input id="usuario" type="text" name="usuario" placeholder="Escribe tu usuario" required>
        <label for="password">Contraseña</label>
        <div class="campo-password">
            <input id="password" type="password" name="password" placeholder="Escribe tu contraseña" required>
            <button type="button" class="btn-toggle-password" onclick="togglePassword('password', this)" aria-label="Mostrar u ocultar contraseña">
                <svg class="icono-ojo-abierto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="icono-ojo-cerrado" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.6 18.6 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
        </div>
        <button type="submit" class="btn" style="width:100%;">Ingresar</button>
    </form>
    <p style="margin-top:12px; text-align:center;">
        ¿No tienes cuenta?
        <a href="{% url 'registro_publico' %}">Regístrate aquí</a>
    </p>
</div>
<script>
function togglePassword(inputId, btn) {
    const input = document.getElementById(inputId);
    const mostrando = input.type === 'text';
    input.type = mostrando ? 'password' : 'text';
    btn.classList.toggle('mostrando', !mostrando);
}
</script>
</body>
</html>
